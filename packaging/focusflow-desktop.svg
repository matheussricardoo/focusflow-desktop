<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="clock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background circle with shadow -->
  <circle cx="256" cy="256" r="220" fill="url(#bg-grad)" filter="url(#shadow)" />
  
  <!-- Outer ring of the clock - perfectly centered -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#clock-grad)" stroke-width="18" />
  
  <!-- Hands - perfectly centered -->
  <!-- Center joint -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="196" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="304" y2="304" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
</svg>
